[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-replay-downloader"
version = "0.1.0"
description = "Save complete Bilibili live replays with QR login and stream copy."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "requests>=2.32.4,<3",
    "imageio-ffmpeg>=0.6,<0.7",
    "qrcode[pil]>=8,<9",
]

[project.scripts]
bili-replay = "bilibili_replay_downloader.downloader:main"

[tool.setuptools.packages.find]
where = ["src"]
