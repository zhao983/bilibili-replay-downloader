name: Windows desktop EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install '.[build]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_windows.py
      - name: Test the packaged executable
        shell: pwsh
        run: |
          $report = Join-Path $pwd 'artifacts/exe-check.json'
          Start-Process -FilePath 'dist/BiliReplayDownloader.exe' -ArgumentList @('--self-test', $report) -Wait -WindowStyle Hidden
          if (!(Test-Path $report) -or !(Get-Content $report -Raw | ConvertFrom-Json).ok) {
            throw 'Packaged desktop verification failed'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: BiliReplayDownloader-Windows-x64
          path: |
            dist/BiliReplayDownloader.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
